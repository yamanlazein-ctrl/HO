version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: littering-postgres
    environment:
      POSTGRES_USER: litter
      POSTGRES_PASSWORD: litter
      POSTGRES_DB: littering
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litter -d littering"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: littering-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://litter:litter@postgres:5432/littering
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - evidence_store:/app/evidence_store
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
  evidence_store:
